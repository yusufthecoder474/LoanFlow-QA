services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: loanflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loanflow_local}
      POSTGRES_DB: loanflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - loanflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanflow -d loanflow"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  loanflow_data:
